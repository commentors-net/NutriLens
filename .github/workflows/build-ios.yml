name: Build iOS IPA

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main
    paths:
      - 'app_flutter/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    name: Build FoodVision iOS IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Check Flutter and Xcode environment
        run: |
          flutter doctor -v
          xcodebuild -version

      - name: Install Flutter dependencies
        working-directory: app_flutter
        run: flutter pub get

      - name: Build iOS Release (Unsigned)
        working-directory: app_flutter
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into FoodVision.ipa
        run: |
          mkdir -p ipa_out/Payload
          cp -R app_flutter/build/ios/iphoneos/Runner.app ipa_out/Payload/
          cd ipa_out
          zip -qr ../FoodVision.ipa Payload
          cd ..
          ls -lh FoodVision.ipa

      - name: Upload FoodVision.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodVision-iOS-IPA
          path: FoodVision.ipa
          retention-days: 14
